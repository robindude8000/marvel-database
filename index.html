<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marvel Marvelan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <style>
    /* Reset so the iframe fills the entire viewport with no gaps/scrollbars */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #05050A; /* matches the app's deepSpace background to avoid a flash on load */
    }

    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Simple loading state shown until the iframe finishes loading */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: #05050A;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #64748b;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 12px;
    }

    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loadingOverlay">Connecting...</div>

  <!--
    Replace YOUR_DEPLOYMENT_ID_HERE below with your actual Apps Script
    deployment ID. Find it via: Apps Script editor -> Deploy -> Manage
    deployments -> copy the "Web app" URL. It looks like:
    https://script.google.com/macros/s/AKfycbz.../exec
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbz9xqxNkLuAqw3TyKA3H8et0T1DdRlEIvNdtRNntEPEUoS2dyRdfOv_nqYN-gf1jiGg/exec"
    title="Marvel Marvelan"
    allow="clipboard-write"
  ></iframe>

  <script>
    document.getElementById('appFrame').addEventListener('load', function () {
      document.getElementById('loadingOverlay').classList.add('hidden');
    });
  </script>

</body>
</html>
